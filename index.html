<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bílá místa — a book by Ivan Burda."
    />
    <title>Bílá místa — Ivan Burda</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="site-shell">
      <header class="site-header">
        <a class="monogram" href="./" aria-label="Ivan Burda home">IB</a>
        <a class="email-link" href="mailto:mail@ivanburda.com">
          mail@ivanburda.com
        </a>
      </header>

      <section class="hero" aria-labelledby="book-title">
        <div class="hero-copy">
          <p class="eyebrow">A book by Ivan Burda</p>
          <h1 id="book-title">Bílá <span>místa</span></h1>
          <p class="intro">
            A quiet space for the words, images, and ideas gathered between the
            lines.
          </p>
          <a class="contact-button" href="mailto:mail@ivanburda.com">
            Get in touch <span aria-hidden="true">↗</span>
          </a>
        </div>

        <figure class="cover">
          <div class="cover-image-wrap">
            <img
              src="assets/bila-mista-cover.jpg"
              alt="Front cover of Bílá místa by Ivan Burda"
            />
          </div>
          <figcaption>Front cover</figcaption>
        </figure>
      </section>

      <footer class="site-footer">
        <span>Ivan Burda</span>
        <a href="mailto:mail@ivanburda.com">mail@ivanburda.com</a>
      </footer>
    </main>
  </body>
</html>
